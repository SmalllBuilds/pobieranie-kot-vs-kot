<title>Kot vs Kot — pobieranie</title>
<style>
:root{--bg1:#120b2e;--bg2:#25145c;--glass:rgba(255,255,255,.10);--line:rgba(255,255,255,.22);--text:#fff;--muted:#cfc8ef;--pink:#ff5d8f;--blue:#4cc9f0;--yellow:#ffd23f;--ink:#14111f}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 20% 10%,#432a8f 0,#1c1044 38%,#090617 100%);color:var(--text);overflow:auto}
.card{width:min(720px,100%);padding:34px 28px 30px;text-align:center;background:rgba(18,12,45,.82);border:4px solid #0a0714;border-radius:24px;box-shadow:10px 10px 0 #0a0714,0 25px 80px rgba(0,0,0,.35);backdrop-filter:blur(10px)}
h1{margin:0 0 8px;font-size:clamp(38px,8vw,72px);font-weight:1000;letter-spacing:-2px;color:var(--yellow);-webkit-text-stroke:2px #0b0814;text-shadow:4px 4px 0 #0b0814}
p{margin:8px 0;color:var(--muted);font-size:17px}
.preview{margin:24px auto;padding:18px;max-width:560px;background:rgba(255,255,255,.07);border:3px solid var(--line);border-radius:18px}
.cats{font-size:62px;letter-spacing:12px;margin-bottom:10px}
button{appearance:none;border:4px solid var(--ink);border-radius:16px;padding:16px 28px;background:var(--yellow);color:var(--ink);font:900 20px "Trebuchet MS",Arial,sans-serif;cursor:pointer;box-shadow:7px 7px 0 var(--ink);transition:transform .08s,box-shadow .08s}
button:hover{transform:translate(3px,3px);box-shadow:4px 4px 0 var(--ink)}
button:active{transform:translate(7px,7px);box-shadow:0 0 0 var(--ink)}
.status{min-height:24px;margin-top:18px;font-weight:700;color:#fff}
.small{font-size:13px;color:#aaa2c8;margin-top:18px}
</style>
</head>

<main class="card">

</main>

function downloadGame() {
  const status = document.getElementById("status");
  try {
    const binary = atob(GAME_BASE64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

    const blob = new Blob([bytes], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");
    link.href = url;
    link.download = "kot-vs-kot.html";
    link.style.display = "none";
    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 10000);
    status.textContent = "✅ Pobieranie rozpoczęte.";
  } catch (err) {
    status.textContent = "❌ Błąd pobierania: " + err.message;
    console.error(err);
  }
}

document.getElementById("downloadBtn").addEventListener("click", downloadGame);
